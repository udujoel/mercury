			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Inject Google URL Scheme";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Derives the ASWebAuthenticationSession callback scheme from\n# GOOGLE_IOS_CLIENT_ID (Secrets.xcconfig) and writes it into the built\n# Info.plist's CFBundleURLTypes, so the scheme registered with the OS can\n# never drift out of sync with the client id GoogleAuthService computes\n# the same scheme from at runtime. See GoogleAuthConfig.urlScheme(for:).\nset -e\n\nCLIENT_ID=\"${GOOGLE_IOS_CLIENT_ID}\"\nPLIST=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\n\nif [ -z \"$CLIENT_ID\" ] || [ \"$CLIENT_ID\" = \"YOUR_IOS_CLIENT_ID_HERE.apps.googleusercontent.com\" ]; then\n  echo \"warning: GOOGLE_IOS_CLIENT_ID is not configured (see Secrets.example.xcconfig); leaving placeholder URL scheme in Info.plist\"\n  exit 0\nfi\n\nif [ ! -f \"$PLIST\" ]; then\n  echo \"warning: built Info.plist not found at $PLIST; skipping URL scheme injection\"\n  exit 0\nfi\n\nPREFIX=\"${CLIENT_ID%.apps.googleusercontent.com}\"\nSCHEME=\"com.googleusercontent.apps.${PREFIX}\"\n\n/usr/libexec/PlistBuddy -c \"Delete :CFBundleURLTypes\" \"$PLIST\" 2>/dev/null || true\n/usr/libexec/PlistBuddy -c \"Add :CFBundleURLTypes array\" \"$PLIST\"\n/usr/libexec/PlistBuddy -c \"Add :CFBundleURLTypes:0 dict\" \"$PLIST\"\n/usr/libexec/PlistBuddy -c \"Add :CFBundleURLTypes:0:CFBundleURLSchemes array\" \"$PLIST\"\n/usr/libexec/PlistBuddy -c \"Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string ${SCHEME}\" \"$PLIST\"\n\necho \"Registered callback scheme: ${SCHEME}\"\n";
		};
/* End PBXShellScriptBuildPhase section */

