name: backend

on:
  push:
    # `main` only. On any other branch the `pull_request` trigger below
    # already runs this suite, and the duplicate run was half of all CI in
    # October 2026, on the same minutes the daily briefing runs on. Those
    # minutes ran out on 2026-09-22 and no briefing ran for eight days.
    # See backend/tests/test_ci_triggers.py.
    branches: [main]
    # `assets/**` on BOTH triggers. Adding it only to `pull_request` left
    # a direct push of an unreadable track reaching the default branch
    # without this suite ever running — the exact gap the filter was added
    # to close, closed on one side only.
    #
    # And every other file this suite reads from outside `backend/`. The
    # tests pin couplings in the workflows (test_ci_triggers.py,
    # test_watchdog_schedule.py), the Worker's crons and SETTINGS_FIELDS
    # (wrangler.toml, index.js) and the spike scripts. Without these paths,
    # a PR that moved the briefing cron or the Worker's 03:40 checkpoint
    # merged without the test written to catch it ever running.
    paths:
      - "backend/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "worker/wrangler.toml"
      - "worker/src/index.js"
  pull_request:
    # `assets/**` too: the music tests decode real files from there, so a
    # change to an asset must run this suite. Without it, replacing a track
    # with something unreadable would be reported by nothing.
    paths:
      - "backend/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "worker/wrangler.toml"
      - "worker/src/index.js"

# A newer push to the same PR supersedes the run in progress. Runs on `main`
# are keyed by commit, not branch: GitHub keeps one running and one PENDING
# run per group and cancels an older pending one when a newer one queues,
# even with cancel-in-progress false, so a shared `main` group would skip
# testing a commit whenever three merges land inside one run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # A run takes about five minutes. Without this a hang runs for GitHub's
    # default of 360, out of the same 2,000 a month the briefing needs. The
    # apt step below is the same one that hung briefing.yml for 20 minutes
    # on both 22 and 23 October 2026.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # pydub shells out to ffmpeg/ffprobe to decode mp3. Without it,
      # `load_music_set` returns None for every set and the music tests
      # cannot tell "the assets are broken" from "this machine cannot read
      # them" — so they would have to be skipped, and a suite that skips
      # the tests protecting the offset rule is the green-suite problem
      # this project keeps meeting.
      #
      # `briefing.yml` installs it for the same reason: without ffmpeg the
      # production run ships a briefing with no music and a warning nobody
      # reads.
      # Five minutes for what normally takes about 30 seconds, as in
      # briefing.yml. Here a timeout SHOULD fail the job: without ffmpeg
      # the music tests cannot run, for the reason above.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
        timeout-minutes: 5
      - run: pip install -r requirements.txt
      - run: ruff check .
      # The whole backend was formatted once on 2026-10-11 (88 of 124 files
      # had drifted from CLAUDE.md's "format on save"); this keeps it so.
      - run: ruff format --check .
      # Catches vulnerable TRANSITIVE dependencies, which Dependabot's
      # manifest scan misses. It found ten advisories nothing else did —
      # eight of them in starlette, the core of the framework serving
      # personal data, pinned indirectly through fastapi.
      - run: pip-audit --progress-spinner off
      - run: pytest -q
