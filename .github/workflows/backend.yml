name: backend

on:
  push:
    # `assets/**` on BOTH triggers. Adding it only to `pull_request` left
    # a direct push of an unreadable track reaching the default branch
    # without this suite ever running — the exact gap the filter was added
    # to close, closed on one side only.
    paths: ["backend/**", "assets/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      # Catches vulnerable TRANSITIVE dependencies, which Dependabot's
      # manifest scan misses. It found ten advisories nothing else did —
      # eight of them in starlette, the core of the framework serving
      # personal data, pinned indirectly through fastapi.
      - run: pip-audit --progress-spinner off
      - run: pytest -q
