name: ios

# CLAUDE.md step 2 requires `xcodebuild build` and `test` before every merge.
# Nothing enforced it: 20 Swift test files in ios/Mercury/MercuryTests ran
# only when someone remembered, and this project's stated failure mode is a
# green suite certifying code the product never ran. The inverse — a suite
# nothing runs at all — had no line in the roadmap until task 23.
#
# COST, stated plainly because it is not free. macOS runners bill at 10x the
# Linux rate, and a private repo gets 2000 minutes a month. A ~5 minute run
# is therefore ~50 charged minutes, against a budget the briefing cron
# already spends ~60 of. The path filter below is what keeps that
# affordable: this runs only when iOS or this file changes, not on every
# backend commit. If the budget becomes a problem, narrow it further or move
# to a self-hosted runner — do not silently delete it and go back to hoping
# someone remembers.
on:
  push:
    # `main` only. On any other branch the `pull_request` trigger below
    # already runs this suite, and the duplicate run was half of all CI in
    # October 2026, on the same minutes the daily briefing runs on. Those
    # minutes ran out on 2026-09-22 and no briefing ran for eight days.
    # See backend/tests/test_ci_triggers.py.
    branches: [main]
    # Both triggers, for the reason backend.yml documents: a filter on
    # `pull_request` alone lets a direct push to the default branch through
    # with the suite never running.
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

# A newer push to the same PR supersedes the run in progress. Runs on `main`
# are keyed by commit, not branch: GitHub keeps one running and one PENDING
# run per group and cancels an older pending one when a newer one queues,
# even with cancel-in-progress false, so a shared `main` group would skip
# testing a commit whenever three merges land inside one run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/Mercury
    steps:
      - uses: actions/checkout@v4

      # The project's `baseConfigurationReference` points at
      # Secrets.xcconfig, which is gitignored — so a fresh checkout cannot
      # configure, let alone build. The example file carries placeholder
      # values, which is all the unit suite needs: it exercises pure
      # functions, decoders and in-memory SwiftData, and reaches no network.
      #
      # Copied rather than committed. A real token in CI would be a
      # credential in a build log for a suite that never makes a request.
      - name: Provide placeholder secrets
        run: |
          test -f Secrets.xcconfig || cp Secrets.example.xcconfig Secrets.xcconfig

      # The newest RELEASED Xcode 26.x on the image, not its default. `macos-15`
      # defaults to Xcode 16.4 (Swift 6.1, the iOS 18 SDK) while the app is
      # built and checked with a far newer one, so CI could not compile an
      # iOS 26 API at all: the first push of #76 failed here and nowhere
      # else (ROADMAP task 60). Code that must still build on an older
      # toolchain keeps its `#if compiler(...)` guard.
      #
      # Pinned to a MAJOR version so CI's compiler moves when this line does,
      # not when GitHub updates the image; minor releases within it are taken
      # as they come. Betas and release candidates are excluded. If the image
      # has no released 26.x the step fails and says so, rather than quietly
      # building with something else.
      - name: Use the newest released Xcode 26
        env:
          XCODE_MAJOR: "26"
        run: |
          set -euo pipefail
          # XCODE_APPS_DIR exists for backend/tests/test_ci_triggers.py, which
          # runs this script against fake app bundles.
          apps="${XCODE_APPS_DIR:-/Applications}"
          newest=$(ls -d "$apps"/Xcode_${XCODE_MAJOR}*.app 2>/dev/null \
            | grep -Eiv 'beta|release.?candidate|_rc' | sort -V | tail -1 || true)
          if [ -z "$newest" ]; then
            echo "::error::No released Xcode ${XCODE_MAJOR}.x on this image:"
            ls -d "$apps"/Xcode*.app || true
            exit 1
          fi
          echo "Selecting $newest"
          sudo xcode-select -s "$newest"

      - name: Show the toolchain
        run: xcodebuild -version && xcrun simctl list runtimes | tail -5

      # An available iPhone on the newest iOS runtime, by UDID. A pinned
      # model name ("iPhone 16") is a red build waiting for the Xcode above
      # to ship a different set of simulators.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(p) for p in runtime.rsplit("iOS-", 1)[1].split("-")]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=version)
          print(next(d["udid"] for r in reversed(runtimes)
                     for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator for this Xcode"
            exit 1
          fi
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # `-destination` names a device FAMILY rather than a specific model:
      # GitHub's images change which simulators are installed, and pinning
      # "iPhone 17 Pro" would turn an image update into a red build for a
      # reason that has nothing to do with the code.
      # No `| xcbeautify`. The first draft piped through it with a `||`
      # fallback to a bare run, which would have executed the ENTIRE suite a
      # second time on any machine where xcbeautify was missing — paying
      # twice, at the 10x rate, to pretty-print nothing.
      - name: Test
        run: |
          xcodebuild test \
            -project Mercury.xcodeproj \
            -scheme Mercury \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Keep the result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ios/Mercury/TestResults.xcresult
