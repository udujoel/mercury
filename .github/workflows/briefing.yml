name: daily briefing

# ADR-008: generation is a scheduled batch job, not a hosted service. It runs
# for ~2 minutes a day and is idle the rest of the time, so a cron runner plus
# object storage replaces a backend entirely.
#
# A private repo gets 2000 Actions minutes a month; a 2-minute daily job uses
# about 60 of them.

on:
  schedule:
    # BACKSTOP ONLY. The punctual trigger is a Cloudflare Cron Trigger that
    # calls workflow_dispatch — see ADR-010 and worker/src/index.js.
    #
    # Seven consecutive days of `cron: "0 4 * * *"` were created 32 minutes to
    # 12 hours late (createdAt == startedAt every time, so this was the
    # scheduler dispatching late, not a queue draining). GitHub documents
    # exactly this: "The schedule event can be delayed during periods of high
    # loads of GitHub Actions workflow runs. High load times include the start
    # of every hour", and "If the load is sufficiently high enough, some queued
    # jobs may be dropped." 04:00 was the single worst minute available.
    #
    # So these entries are off the hour, and they sit AFTER the Worker's 03:40
    # trigger rather than before it. That ordering is deliberate: generation is
    # idempotent, so the earliest trigger to succeed is the one that decides
    # how fresh the briefing is. An earlier backstop would win the race on a
    # healthy day and hand the user a staler inbox for no benefit.
    #
    # Cron is UTC-only and has no DST. Europe/Lisbon is UTC+1 in summer, so the
    # tight deadline is the summer one: 06:00 Lisbon == 05:00 UTC. Both entries
    # are sized against that, and winter simply gets an extra hour of margin.
    # The briefing is NAMED in the user's timezone by app.cli, which is what
    # actually matters; see the five date bugs this project has already had.
    # EVERY SIX HOURS, not once a night.
    #
    # A briefing made at 04:00 describes an inbox that has moved on by
    # lunchtime, and the news it clustered is half a day old by the evening.
    # Four runs a day means what you open is never more than six hours
    # behind — which is the point of the product rather than a nicety.
    #
    # This is only affordable because runs no longer OVERWRITE each other:
    # ids carry a `-HHMM` time, so the day accumulates briefings and you can
    # still hear the one from this morning. Before that change, four runs a
    # day would have meant three thrown away.
    #
    # Off the hour for the reason above: the top of the hour is the single
    # worst minute to ask GitHub's scheduler for anything.
    #
    # The morning slot is 06:12, NOT 04:12, and that is to stay out of the
    # Worker's way. ADR-010 moved the punctual morning trigger to Cloudflare
    # precisely because GitHub's scheduler runs late, and its checkpoints
    # cover 03:40 to 05:40 UTC. A GitHub run at 04:12 would land in the
    # middle of that and generate a SECOND briefing — distinct now that ids
    # carry a time, where before it would have been a no-op. Five runs a day
    # and five briefings, when the ask was four.
    #
    # At 06:12 the Cloudflare window has closed, so this is the first of the
    # four six-hourly runs rather than a duplicate of a morning that already
    # happened. The Worker still backstops the morning; these keep the rest
    # of the day fresh.
    - cron: "12 6 * * *"
    - cron: "12 12 * * *"
    - cron: "12 18 * * *"
    - cron: "12 0 * * *"
  workflow_dispatch:
    inputs:
      length:
        description: "Briefing length"
        required: false
        default: "standard"
        type: choice
        options: [express, standard, full]
      briefing_id:
        description: "Exact id (YYYY-MM-DD or YYYY-MM-DD-HHMM). Blank = new."
        required: false
      briefing_day:
        description: "Day to generate FOR (YYYY-MM-DD); the time is appended."
        required: false
        type: string
      force:
        description: "Regenerate even if this briefing already exists"
        required: false
        default: false
        type: boolean

concurrency:
  # Never two generations at once — each costs real Gemini and TTS spend.
  group: daily-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        # Required for AAC export. Without it the pipeline falls back to WAV,
        # which is ~17MB instead of ~4MB — a real difference for a phone
        # downloading it over cellular every morning.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: pip install -r requirements.txt

      - name: Write credential files
        # The Google SDKs want files, not env vars. These are written into the
        # runner's ephemeral filesystem and never leave it.
        env:
          TTS_KEY: ${{ secrets.GOOGLE_TTS_CREDENTIALS_JSON }}
          OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$TTS_KEY" > credentials/gcp-tts.json
          printf '%s' "$OAUTH_TOKEN" > ../token.json

          # Validate SHAPE, not just non-emptiness. The first real run failed
          # with a 20-line google.auth traceback ending in "missing fields
          # token_uri, client_email" — which is what you get when the OAuth
          # *client* file (credentials.json, whose only top-level key is
          # "installed") is pasted in place of the service-account key. Three
          # similar-looking JSON files are involved in this project and it is
          # genuinely easy to mix them up; the error should say which one is
          # wrong, not make you read a stack trace to find out.
          python - <<'CHECK'
          import json, sys

          def load(path, secret):
              try:
                  with open(path) as fh:
                      return json.load(fh)
              except FileNotFoundError:
                  sys.exit(f"::error::{secret} produced no file")
              except json.JSONDecodeError as exc:
                  sys.exit(f"::error::{secret} is not valid JSON: {exc}")

          def as_object(value, secret):
              # Not decoration: without this the membership tests below run
              # against a string or list and do substring matching, which
              # happens to give the right answer for today's inputs and would
              # give a misleading one for a secret containing "token_uri"
              # anywhere in its text.
              if not isinstance(value, dict):
                  sys.exit(
                      f"::error::{secret} is valid JSON but not an object "
                      f"(got {type(value).__name__})."
                  )
              return value

          sa = as_object(
              load("credentials/gcp-tts.json", "GOOGLE_TTS_CREDENTIALS_JSON"),
              "GOOGLE_TTS_CREDENTIALS_JSON",
          )
          if "installed" in sa or "web" in sa:
              sys.exit(
                  "::error::GOOGLE_TTS_CREDENTIALS_JSON looks like an OAuth "
                  "CLIENT file (credentials.json). It needs the SERVICE "
                  "ACCOUNT key: Google Cloud Console -> IAM & Admin -> "
                  "Service Accounts -> Keys -> Add key -> JSON."
              )
          missing = [
              k for k in ("client_email", "private_key", "token_uri")
              if not str(sa.get(k) or "").strip()
          ]
          if missing:
              sys.exit(
                  f"::error::GOOGLE_TTS_CREDENTIALS_JSON is missing {', '.join(missing)}. "
                  "Expected a service-account key JSON."
              )

          tok = as_object(
              load("../token.json", "GOOGLE_OAUTH_TOKEN_JSON"),
              "GOOGLE_OAUTH_TOKEN_JSON",
          )
          # Truthy, not merely present: a key with an empty value would sail
          # through and fail minutes later with invalid_grant.
          if not str(tok.get("refresh_token") or "").strip():
              sys.exit(
                  "::error::GOOGLE_OAUTH_TOKEN_JSON has no refresh_token. "
                  "Expected the token.json produced by running a spike "
                  "locally, not credentials.json."
              )
          print("credential files look structurally correct")
          CHECK

      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_CREDENTIALS: ./credentials/gcp-tts.json
          # Voice. `TTS_PROVIDER` selects; with it unset or ElevenLabs
          # unavailable, `build_tts_provider` falls back to Google and logs
          # loudly — rule 6 keeps Google behind the protocol so a paid tier
          # going down at 4am costs the voice, not the briefing.
          #
          # The two voice ids are not secret, but they live in secrets
          # alongside the key so there is one screen to set all of this on
          # rather than two. They become app settings in ROADMAP task 11.
          TTS_PROVIDER: ${{ secrets.TTS_PROVIDER }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_A: ${{ secrets.ELEVENLABS_VOICE_A }}
          ELEVENLABS_VOICE_B: ${{ secrets.ELEVENLABS_VOICE_B }}
          GOOGLE_TOKEN_FILE: ${{ github.workspace }}/token.json
          MERCURY_API_TOKEN: ${{ secrets.MERCURY_API_TOKEN }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_TIMEZONE: ${{ secrets.USER_TIMEZONE }}
          BRIEFING_LENGTH: ${{ inputs.length || 'standard' }}
          # Passed as env, not interpolated into the command. Expression
          # substitution happens BEFORE the shell runs, so an id containing a
          # space or a semicolon would be parsed as shell syntax rather than
          # treated as an argument. GitHub's own hardening guidance.
          BRIEFING_ID: ${{ inputs.briefing_id }}
          BRIEFING_DAY: ${{ inputs.briefing_day }}
          FORCE: ${{ inputs.force }}
          STORAGE_BACKEND: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # --force exists because generation is idempotent: a briefing that
          # already exists is a no-op. Correct for a cron that may fire twice,
          # but it also meant a briefing generated from a BROKEN run could
          # never be replaced — the first deployment shipped one with no
          # inbox and no calendar in it, and re-running simply declined.
          #
          # `--briefing-day` is what the SCHEDULER passes, and the difference
          # from `--briefing-id` matters. The runner derives its own "today",
          # so a checkpoint firing at 23:58 local whose job starts at 00:01
          # would generate tomorrow and leave the day it was worried about
          # empty — the sixth date bug in a project that has had five. The
          # day comes from whoever made the decision; only the time of the
          # run is the job's to choose.
          args=()
          if [ -n "$BRIEFING_ID" ]; then args+=(--briefing-id "$BRIEFING_ID"); fi
          if [ -n "$BRIEFING_DAY" ]; then args+=(--briefing-day "$BRIEFING_DAY"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python -m app.cli generate "${args[@]}"

      - name: Prune old briefings
        # Housekeeping, and it runs in the same job as generation, so it must
        # never be the reason a morning reports failure — hence
        # continue-on-error. It runs even when generation failed (if: always)
        # because retention is independent of whether today worked, and it can
        # never touch today's briefing in any case.
        #
        # Nothing deleted anything before this step existed. The docs claimed a
        # 7-day retention for months; there was no such thing anywhere.
        if: always()
        continue-on-error: true
        env:
          USER_TIMEZONE: ${{ secrets.USER_TIMEZONE }}
          STORAGE_BACKEND: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # A repository variable, not a secret. Defaulted here rather than
          # left blank: an empty string is not an integer and would fail
          # settings validation.
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '30' }}
        run: python -m app.cli prune

      - name: Scrub credentials
        # Belt and braces. The runner is destroyed anyway, but a half-failed
        # run should not leave a Google refresh token sitting in a workspace
        # that a later step could archive.
        if: always()
        run: rm -f credentials/gcp-tts.json ../token.json
