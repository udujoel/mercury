name: worker

# The guard against the next `music_set` bug, which was itself unguarded.
#
# `worker/test/scheduled.test.mjs` was written specifically to stop a repeat
# of the bug where `music_set` was stripped by the Worker's SETTINGS_FIELDS
# whitelist — so the picker encoded it, the pipeline read it, and the Worker
# deleted it on every save. The music setting had never once applied in
# production.
#
# That test ran only when a human typed `npm test` in `worker/`. backend.yml
# filters on `backend/**`, which `worker/**` does not match, and there was no
# worker workflow. So the guard against the failure class was itself an
# instance of it: complete, correct, and reached by nothing.
on:
  push:
    # `main` only. On any other branch the `pull_request` trigger below
    # already runs this suite, and the duplicate run was half of all CI in
    # October 2026, on the same minutes the daily briefing runs on. Those
    # minutes ran out on 2026-09-22 and no briefing ran for eight days.
    # See backend/tests/test_ci_triggers.py.
    branches: [main]
    # Both triggers, for the reason backend.yml documents: a filter added to
    # `pull_request` alone lets a direct push to the default branch through
    # without the suite ever running.
    paths: ["worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["worker/**", ".github/workflows/worker.yml"]

# A newer push to the same PR supersedes the run in progress. Runs on `main`
# are keyed by commit, not branch: GitHub keeps one running and one PENDING
# run per group and cancels an older pending one when a newer one queues,
# even with cancel-in-progress false, so a shared `main` group would skip
# testing a commit whenever three merges land inside one run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Every run so far took 9-13 seconds. Without this a hang runs for
    # GitHub's default of 360 minutes, 18% of the 2,000 a month that the
    # briefing is generated out of. See backend/tests/test_ci_triggers.py.
    timeout-minutes: 5
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, matching the version this is developed against.
          #
          # The first CI run pinned 20 and failed with
          # `Could not find 'test/*.test.mjs'`: the glob is QUOTED in
          # package.json, so node must expand it itself, and node only
          # learned to do that in 21. The script now uses bare `node --test`,
          # which discovers `**/*.test.mjs` from the working directory and
          # has worked since 18 — so this pin matches local behaviour rather
          # than propping the script up.
          node-version: "22"
      # No `npm ci`: worker/ has no dependencies and no lockfile. The suite
      # imports the source directly and runs on the standard library alone,
      # which is why it takes under a second.
      - run: npm test
